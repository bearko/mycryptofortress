<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MyCryptoFortress ─ 幻獣防衛戦</title>
    <meta name="description" content="マイクリプトヒーローズのヒーローを配置して幻獣を守るタワーディフェンス × インクリメンタル。負けても CE でスキルツリーを強化し、次こそ突破！" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- OGP / X（Twitter）カード: サムネイルは design/thumbnail/ から生成 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyCryptoFortress" />
    <meta property="og:title" content="MyCryptoFortress ─ 幻獣防衛戦" />
    <meta property="og:description" content="ヒーローを配置して幻獣を守れ。負けても CE でスキルツリーを強化し、次こそ突破！（タワーディフェンス × インクリメンタル）" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyCryptoFortress ─ 幻獣防衛戦" />
    <meta name="twitter:description" content="ヒーローを配置して幻獣を守れ。負けても CE でスキルツリーを強化し、次こそ突破！" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0d12;
        color: #e7eaf0;
        font-family: "Meiryo UI", Meiryo, "Yu Gothic UI", YuGothic, "Yu Gothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", IPAPGothic, sans-serif;
        overflow: hidden;
        width: 100%;
        height: 100%;
        /* SPEC-101 §5.3: スマホでのスクロール・ダブルタップ拡大・長押しメニューを抑止 */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      .loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 14px;
        color: #8a93a6;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loader">Loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
