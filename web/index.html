<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MyCryptoFortress</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0d12;
        color: #e7eaf0;
        font-family: "Meiryo UI", Meiryo, "Yu Gothic UI", YuGothic, "Yu Gothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", IPAPGothic, sans-serif;
        overflow: hidden;
        width: 100%;
        height: 100%;
        /* SPEC-101 §5.3: スマホでのスクロール・ダブルタップ拡大・長押しメニューを抑止 */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      .loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 14px;
        color: #8a93a6;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loader">Loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
